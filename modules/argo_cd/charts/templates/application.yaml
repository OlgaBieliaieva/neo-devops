apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "{{ .Values.repo_url | default "https://github.com/OlgaBieliaieva/neo-devops/tree/lesson-8-9" }}"
    path: "{{ .Values.path | default "charts/django-app" }}"
    targetRevision: "{{ .Values.targetRevision | default "main" }}"
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true