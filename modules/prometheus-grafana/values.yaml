grafana:
  adminUser: admin
  adminPassword: prom-operator
  service:
    type: LoadBalancer
    port: 80
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: gp2

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
